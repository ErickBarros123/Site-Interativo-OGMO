name: Robô OGMO Automático

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4 pandas openpyxl

      - name: Executar script de varredura
        run: python Extrator.py

      - name: Salvar e atualizar JSON no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Robô OGMO"
          git config --global user.email "robo@ogmo.local"
          git status
          git add novo_data.json
          git diff --staged --quiet || git commit -m "Atualização automática de escalas [skip ci]"
          git push origin HEAD:main