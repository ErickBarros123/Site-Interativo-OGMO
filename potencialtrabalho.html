<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador: Trabalho e Potencial Elétrico</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --accent: #10b981; /* Verde "aprovado" */
            --charge: #ef4444; /* Vermelho para carga positiva */
            --field: #3b82f6; /* Azul para o campo elétrico */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard {
            background-color: var(--panel-bg);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-top: 0;
            color: var(--accent);
            text-transform: uppercase;
            font-size: 1.2rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .simulation-container {
            position: relative;
            background-color: #0b1121;
            border: 1px solid #334155;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .data-panel {
            display: flex;
            justify-content: space-between;
            background-color: #0b1121;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        .data-box {
            display: flex;
            flex-direction: column;
        }

        .data-box span {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .data-box strong {
            font-size: 1.5rem;
            color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #059669;
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>Simulação: Deslocamento da Carga q0</h2>
        
        <div class="simulation-container">
            <svg id="sim-svg" width="100%" height="300" viewBox="0 0 600 300">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
                    </marker>
                </defs>
                <g stroke="#3b82f6" stroke-width="2" opacity="0.4" marker-end="url(#arrowhead)">
                    <line x1="50" y1="50" x2="550" y2="50" />
                    <line x1="50" y1="100" x2="550" y2="100" />
                    <line x1="50" y1="150" x2="550" y2="150" />
                    <line x1="50" y1="200" x2="550" y2="200" />
                    <line x1="50" y1="250" x2="550" y2="250" />
                </g>
                <text x="560" y="145" fill="#3b82f6" font-family="Courier New" font-weight="bold">Vetor E</text>

                <path id="trajectory" d="M 100 250 C 200 280, 250 100, 350 150 S 450 50, 500 80" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5, 5" />
                
                <circle cx="100" cy="250" r="5" fill="#f8fafc" />
                <text x="75" y="255" fill="#f8fafc" font-family="sans-serif">Ponto i</text>
                
                <circle cx="500" cy="80" r="5" fill="#f8fafc" />
                <text x="515" y="85" fill="#f8fafc" font-family="sans-serif">Ponto f</text>

                <circle id="charge" cx="100" cy="250" r="10" fill="#ef4444" />
                <text id="charge-label" x="92" y="254" fill="#fff" font-size="12" font-family="sans-serif" font-weight="bold">+</text>
            </svg>
        </div>

        <div class="data-panel">
            <div class="data-box">
                <span>Trabalho Realizado (W)</span>
                <strong id="work-display">0.00 J</strong>
            </div>
            <div class="data-box">
                <span>Posição no Eixo X (dx)</span>
                <strong id="x-display">100.00 m</strong>
            </div>
            <div class="data-box">
                <span>Status da Simulação</span>
                <strong id="status-display" style="color: #94a3b8;">Aguardando</strong>
            </div>
        </div>

        <button id="start-btn" onclick="startSimulation()">Iniciar Deslocamento ds</button>
    </div>

    <script>
        const path = document.getElementById('trajectory');
        const charge = document.getElementById('charge');
        const chargeLabel = document.getElementById('charge-label');
        const workDisplay = document.getElementById('work-display');
        const xDisplay = document.getElementById('x-display');
        const statusDisplay = document.getElementById('status-display');
        const startBtn = document.getElementById('start-btn');
        
        const pathLength = path.getTotalLength();
        const duration = 4000; // 4 segundos de animação
        let startTime = null;
        let animationFrame;

        // O trabalho em um campo elétrico uniforme no eixo X depende apenas da variação em X
        // W = q * E * (xf - xi). Valores fictícios para ilustrar a matemática.
        const qE = 0.5; // Constante q0 * E
        const xi = 100; // Posição X inicial na tela

        function animateCharge(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = timestamp - startTime;
            const percent = Math.min(progress / duration, 1);
            
            // Pega a coordenada (x,y) atual baseada no comprimento do caminho
            const point = path.getPointAtLength(percent * pathLength);
            
            // Move a carga e o sinal de +
            charge.setAttribute('cx', point.x);
            charge.setAttribute('cy', point.y);
            chargeLabel.setAttribute('x', point.x - 4);
            chargeLabel.setAttribute('y', point.y + 4);

            // Calcula a física simulada em tempo real
            const currentX = point.x;
            const work = qE * (currentX - xi);
            
            // Atualiza o painel
            workDisplay.innerText = work.toFixed(2) + ' J';
            xDisplay.innerText = currentX.toFixed(2) + ' m';

            if (percent < 1) {
                animationFrame = requestAnimationFrame(animateCharge);
            } else {
                statusDisplay.innerText = "Concluído";
                statusDisplay.style.color = "#10b981"; // Verde
                startBtn.disabled = false;
                startBtn.innerText = "Reiniciar Simulação";
            }
        }

        function startSimulation() {
            startBtn.disabled = true;
            statusDisplay.innerText = "Calculando Integral...";
            statusDisplay.style.color = "#ef4444"; // Vermelho operando
            startTime = null;
            cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(animateCharge);
        }
    </script>
</body>
</html>
